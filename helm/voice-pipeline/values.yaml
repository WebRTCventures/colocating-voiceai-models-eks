# Scheduling
scheduling:
  colocated: true
  nodeSelector: {}

# Shared pipeline label (for identification/monitoring, NOT used as affinity selector)
pipeline:
  group: pipeline

# GPU toleration applied to all pods in colocated mode
gpu:
  taint:
    key: nvidia.com/gpu
    value: "true"
    effect: NoSchedule

# LLM configuration (own GPU node)
llm:
  image:
    repository: public.ecr.aws/deep-learning-containers/vllm
    tag: server-cuda
  model: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
  args:
    gpuMemoryUtilization: "0.90"
    maxModelLen: "4096"
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      memory: 20Gi
      nvidia.com/gpu: "1"
  startupProbe:
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    periodSeconds: 30
    failureThreshold: 3
  port: 8000

# Speaches STT+TTS configuration (own GPU node)
speaches:
  enabled: true
  tolerateGpuTaint: true
  image:
    repository: ghcr.io/speaches-ai/speaches
    tag: "0.9.0-rc.3-cuda"
  env:
    WHISPER__MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
    WHISPER__INFERENCE_DEVICE: cuda
    WHISPER__COMPUTE_TYPE: float16
    # HF_TOKEN: ""  # Set via --set speaches.env.HF_TOKEN=hf_xxx (required for model download)
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      nvidia.com/gpu: "1"
    limits:
      memory: 8Gi
      nvidia.com/gpu: "1"
  readinessProbe:
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 5
  port: 8000

# Orchestrator configuration
orchestrator:
  tolerateGpuTaint: false
  image:
    repository: ""  # Set to your ECR URL: <account>.dkr.ecr.<region>.amazonaws.com/voiceai-eks/orchestrator
    tag: "latest"
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  port: 8080
  ttsModel: "speaches-ai/Kokoro-82M-v1.0-ONNX"
  # LiveKit connection (required for the orchestrator to start)
  livekit:
    url: ""        # e.g., wss://livekit.example.com
    apiKey: ""     # LiveKit API key
    apiSecret: ""  # LiveKit API secret

# Karpenter NodePool
nodepool:
  enabled: true
  instanceTypes:
    - g5.xlarge
  capacityType: on-demand
  availabilityZone: us-east-1a
  gpuLimit: 2
  nodeClassRef:
    group: eks.amazonaws.com
    kind: NodeClass
    name: default
  disruption:
    consolidateAfter: 30m
    consolidationPolicy: WhenEmpty
    budgets:
      - nodes: "0"
