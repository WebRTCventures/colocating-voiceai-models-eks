# 3-Node Layout: all components in the same AZ/subnet for low latency
# Node 1 (CPU): LiveKit + Orchestrator — colocated on a general-purpose node
# Node 2 (GPU): LLM (vLLM) — dedicated g5.xlarge
# Node 3 (GPU): Speaches STT+TTS — dedicated g5.xlarge
#
# All nodes pinned to us-east-1a for minimum inter-node latency.

# Shared pipeline label (for identification/monitoring)
pipeline:
  group: pipeline

# GPU toleration applied to GPU pods
gpu:
  taint:
    key: nvidia.com/gpu
    value: "true"
    effect: NoSchedule

# LLM configuration (dedicated GPU node — g5.xlarge has 1 GPU, so Karpenter
# provisions a separate node automatically)
llm:
  image:
    repository: public.ecr.aws/deep-learning-containers/vllm
    tag: server-cuda
  model: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
  args:
    gpuMemoryUtilization: "0.90"
    maxModelLen: "4096"
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      nvidia.com/gpu: "1"
    limits:
      memory: 20Gi
      nvidia.com/gpu: "1"
  startupProbe:
    periodSeconds: 10
    failureThreshold: 30
  readinessProbe:
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    periodSeconds: 30
    failureThreshold: 3
  port: 8000

# Speaches STT+TTS configuration (dedicated GPU node — g5.xlarge has 1 GPU,
# so Karpenter provisions a separate node from LLM automatically)
speaches:
  enabled: true
  image:
    repository: ghcr.io/speaches-ai/speaches
    tag: "0.9.0-rc.3-cuda"
  env:
    WHISPER__MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
    WHISPER__INFERENCE_DEVICE: cuda
    WHISPER__COMPUTE_TYPE: float16
    # HF_TOKEN: ""  # Set via --set speaches.env.HF_TOKEN=hf_xxx (required for model download)
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      nvidia.com/gpu: "1"
    limits:
      memory: 8Gi
      nvidia.com/gpu: "1"
  readinessProbe:
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 5
  port: 8000

# Orchestrator configuration (shares CPU node with LiveKit — no GPU toleration)
orchestrator:
  image:
    repository: ""  # Set to your ECR URL: <account>.dkr.ecr.<region>.amazonaws.com/voiceai-eks/orchestrator
    tag: "latest"
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  port: 8080
  ttsModel: "speaches-ai/Kokoro-82M-v1.0-ONNX"
  # LiveKit connection (required for the orchestrator to start)
  livekit:
    url: ""        # e.g., wss://livekit.example.com
    apiKey: ""     # LiveKit API key
    apiSecret: ""  # LiveKit API secret

# Karpenter NodePool — provisions 2 GPU nodes in the same AZ
nodepool:
  enabled: true
  instanceTypes:
    - g5.xlarge
  capacityType: on-demand
  availabilityZone: us-east-1a
  gpuLimit: 2
  nodeClassRef:
    group: eks.amazonaws.com
    kind: NodeClass
    name: default
  disruption:
    consolidateAfter: Never
    consolidationPolicy: WhenEmpty
    budgets:
      - nodes: "0"
