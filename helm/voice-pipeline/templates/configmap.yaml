apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-pipeline-endpoints
  labels:
    {{- include "voice-pipeline.labels" . | nindent 4 }}
data:
  # NOTE: In production, LIVEKIT_API_KEY and LIVEKIT_API_SECRET should be stored
  # in a Kubernetes Secret, not a ConfigMap. Using a ConfigMap here for demo simplicity.
  STT_BASE_URL: "http://voice-pipeline-speaches.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.speaches.port }}/v1"
  TTS_BASE_URL: "http://voice-pipeline-speaches.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.speaches.port }}/v1"
  LLM_BASE_URL: "http://voice-pipeline-llm.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.llm.port }}/v1"
  LLM_MODEL: "{{ .Values.llm.model }}"
  STT_MODEL: "{{ .Values.speaches.env.WHISPER__MODEL }}"
  TTS_MODEL: "{{ .Values.orchestrator.ttsModel | default "speaches-ai/Kokoro-82M-v1.0-ONNX" }}"
  {{- with .Values.orchestrator.livekit }}
  {{- if .url }}
  LIVEKIT_URL: "{{ .url }}"
  {{- end }}
  {{- if .apiKey }}
  LIVEKIT_API_KEY: "{{ .apiKey }}"
  {{- end }}
  {{- if .apiSecret }}
  LIVEKIT_API_SECRET: "{{ .apiSecret }}"
  {{- end }}
  {{- end }}
