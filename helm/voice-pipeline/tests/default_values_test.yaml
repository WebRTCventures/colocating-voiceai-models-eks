suite: default values tests (3-node mode)
templates:
  - templates/llm-deployment.yaml
  - templates/speaches-deployment.yaml
  - templates/orchestrator-deployment.yaml
  - templates/services.yaml
  - templates/configmap.yaml
  - templates/karpenter-nodepool.yaml
tests:
  # --- Resource count ---
  - it: should render LLM Deployment
    template: templates/llm-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: should render Speaches Deployment
    template: templates/speaches-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: should render Orchestrator Deployment
    template: templates/orchestrator-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: should render 3 Services
    template: templates/services.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: should render 1 ConfigMap
    template: templates/configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: should render 1 NodePool
    template: templates/karpenter-nodepool.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NodePool

  # --- GPU resources ensure node isolation (1 GPU per g5.xlarge) ---
  - it: LLM should request 1 GPU
    template: templates/llm-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: "1"

  - it: Speaches should request 1 GPU
    template: templates/speaches-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: "1"

  # --- No affinity rules needed (nodepools + taints handle isolation) ---
  - it: LLM should have no affinity
    template: templates/llm-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: Speaches should have no affinity
    template: templates/speaches-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: Orchestrator should have no affinity
    template: templates/orchestrator-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  # --- GPU tolerations on GPU pods only ---
  - it: LLM should have GPU toleration
    template: templates/llm-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

  - it: Speaches should have GPU toleration
    template: templates/speaches-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule

  - it: Orchestrator should NOT have GPU toleration
    template: templates/orchestrator-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.tolerations

  # --- Pipeline group labels ---
  - it: LLM pod should carry pipeline group label
    template: templates/llm-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.voice-pipeline/group
          value: pipeline

  - it: Speaches pod should carry pipeline group label
    template: templates/speaches-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.voice-pipeline/group
          value: pipeline

  - it: Orchestrator pod should carry pipeline group label
    template: templates/orchestrator-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.voice-pipeline/group
          value: pipeline
